name: Composer Director lab
on:
  pull_request:
    paths:
      - 'labs/composer-director/**'
      - 'tools/composition_probe.py'
      - 'tests/**'
      - 'docs/composer-director/**'
      - 'game-music-composer/scripts/**'
      - 'game-music-composer/data/**'
      - '.github/workflows/composer-director-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: composer-director-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Unit and deterministic sketch tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/test_director.cjs
      - name: Initialize a real engine fixture
        working-directory: game-music-composer
        run: python scripts/neospc.py init ../.scratch/director-ci --title "Director CI" --category mystery --game-context puzzle --mood mysterious --bpm 96 --meter 4/4 --key D --mode dorian --voices 12 --bars 8
      - name: Probe real compose-stage wiring (no audio or quality claim)
        run: |
          python -c "import json,pathlib; p=pathlib.Path('docs/composer-director/probe-cases.json'); cases=json.loads(p.read_text()); keep={'melody.rest_ratio','brief.seed','humanize.timing_depth'}; pathlib.Path('.scratch/director-ci-cases.json').write_text(json.dumps([c for c in cases if c['control'] in keep]))"
          python tools/composition_probe.py --project .scratch/director-ci --cases .scratch/director-ci-cases.json --out .scratch/director-ci-report.json
          python -c "import json,pathlib; r=json.loads(pathlib.Path('.scratch/director-ci-report.json').read_text()); print(json.dumps(r,indent=2)); assert r['baseline_repeatable']; assert any('score' in c.get('changed_layers',[]) for c in r['cases']), 'No musical change observed in positive-control probes'"
